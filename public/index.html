<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Station Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:#090910;
  color:#c8c8d8;
  font-family:'Courier New',Consolas,monospace;
  font-size:13px;
  min-height:100vh;
}

/* ── HEADER ────────────────────────────────────────────── */
#hdr{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:#06060c;
  border-bottom:2px solid #181828;
  padding:8px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:6px;
}
#hdr-left{display:flex;flex-direction:column;gap:2px}
#hdr-title{
  font-size:17px;
  font-weight:bold;
  letter-spacing:3px;
  color:#e8e8f4;
  text-transform:uppercase;
}
#hdr-meta{font-size:10px;color:#a8a8c0;letter-spacing:1px}
#sample-badge{
  font-size:9px;letter-spacing:2px;text-transform:uppercase;
  padding:3px 10px;border-radius:2px;white-space:nowrap;
  color:#ffaa00;border:1px solid #ffaa0044;background:#ffaa0010;
}
#sample-badge.no-conn{color:#ff6060;border-color:#ff606044;background:#ff606010}
[data-theme="light"] #sample-badge{color:#885500;border-color:#bb770044;background:#bb770010}
[data-theme="light"] #sample-badge.no-conn{color:#880000;border-color:#cc000044;background:#cc000010}
#clock{
  font-size:26px;
  font-weight:bold;
  color:#00aaff;
  letter-spacing:4px;
  text-shadow:0 0 12px #00aaff55;
  white-space:nowrap;
}

/* ── GRID ─────────────────────────────────────────────── */
.grid{
  margin-top:58px;
  display:flex;flex-direction:column;gap:9px;padding:10px;
}

.dash-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.dash-row>.card{min-width:0}

.card.span2{grid-column:span 2}
.card.span3{grid-column:span 3}
.card.span4{grid-column:span 4}

@media(max-width:900px){
  .dash-row{grid-template-columns:repeat(2,1fr)}
  .card.span3,.card.span4{grid-column:span 2}
}
@media(max-width:480px){
  .dash-row{grid-template-columns:1fr}
  .card.span2,.card.span3,.card.span4{grid-column:span 1}
}

/* ── CARD ─────────────────────────────────────────────── */
.card{
  background:#10101c;
  border:1px solid #1c1c2e;
  border-radius:2px;
  overflow:hidden;
}
.ch{
  padding:5px 11px;
  font-size:10px;
  font-weight:bold;
  letter-spacing:2px;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:8px;
}
.cs{
  font-size:10px;
  font-style:italic;
  color:#a8a8c0;
  padding:2px 11px 5px;
  letter-spacing:.5px;
}
.cb{padding:10px 12px}

/* header accent colours */
.ht{background:#0b3230;color:#00c8a0;border-bottom:1px solid #154840}
.hb{background:#0b1d38;color:#4db8ff;border-bottom:1px solid #153060}
.ha{background:#281c00;color:#ffaa00;border-bottom:1px solid #483400}
.hr{background:#280b0b;color:#ff6060;border-bottom:1px solid #481818}
.hp{background:#1c0b28;color:#c080ff;border-bottom:1px solid #341848}
.hg{background:#0b2814;color:#60d060;border-bottom:1px solid #185028}
.hw{background:#1c1828;color:#a0a0c8;border-bottom:1px solid #302c44}

/* ── BIG STAT ─────────────────────────────────────────── */
.big{
  font-size:52px;
  font-weight:bold;
  line-height:1;
  color:#e8e8f4;
  letter-spacing:-1px;
}
.unit{font-size:18px;color:#a8a8c0;margin-left:3px}
.slabel{
  font-size:10px;
  color:#a8a8c0;
  margin-top:5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

/* ── MINI STAT ROW ────────────────────────────────────── */
.mrow{
  display:flex;
  justify-content:space-around;
  text-align:center;
  padding:8px 0 2px;
  border-top:1px solid #1a1a2a;
  margin-top:10px;
}
.mrow .mv{font-size:22px;font-weight:bold;color:#d0d0e4}
.mrow .ml{font-size:9px;color:#a8a8c0;text-transform:uppercase;letter-spacing:1px;margin-top:2px}

/* ── HUMIDITY BAR ─────────────────────────────────────── */
.hbar-track{
  background:#0a0a14;
  border:1px solid #1a1a2a;
  border-radius:1px;
  height:10px;
  margin-top:8px;
  overflow:hidden;
}
.hbar-fill{
  height:100%;
  background:linear-gradient(90deg,#00c8a044,#00c8a0);
  transition:width 1.2s ease;
}
.hbar-labels{
  display:flex;
  justify-content:space-between;
  font-size:9px;
  color:#9090a8;
  margin-top:2px;
}

/* ── GAUGE ────────────────────────────────────────────── */
.gauge-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px 12px 6px;
}
.gauge-badge{
  display:inline-block;
  padding:3px 10px;
  border-radius:2px;
  font-weight:bold;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-top:4px;
}
.gauge-note{font-size:9px;color:#9090a8;margin-top:4px;letter-spacing:.5px}

/* ── AQI BADGE (big) ──────────────────────────────────── */
.aqi-big{
  text-align:center;
  padding:14px 12px;
}
.aqi-big .alabel{font-size:10px;color:#a8a8c0;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.aqi-big .aval{font-size:56px;font-weight:bold;line-height:1;margin-bottom:6px}
.aqi-big .adesc{font-size:14px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;padding:4px 14px;border-radius:2px;display:inline-block}
.aqi-big .asub{font-size:10px;color:#a8a8c0;margin-top:6px}

/* ── CHART WRAPPER ────────────────────────────────────── */
.cw{position:relative;height:170px;padding:4px 8px 8px}
.cw-tall{position:relative;height:210px;padding:4px 8px 8px}

/* ── PM TABLE ─────────────────────────────────────────── */
.pm-table{width:100%;border-collapse:collapse;font-size:12px}
.pm-table td{padding:5px 10px}
.pm-table tr:not(:last-child) td{border-bottom:1px solid #141424}
.pm-val{font-size:22px;font-weight:bold;text-align:right}
.pm-bar-cell{width:45%}
.pm-bar-bg{background:#0a0a14;border-radius:1px;height:8px;overflow:hidden}
.pm-bar-fg{height:100%;border-radius:1px;transition:width 1s}

/* ── WIND ROSE ────────────────────────────────────────── */
.wind-center{text-align:center;padding:10px 12px}
.wind-dir-label{
  font-size:32px;font-weight:bold;color:#4db8ff;
  display:block;margin-bottom:4px;
}
.wind-speeds{display:flex;justify-content:space-around;margin-top:8px}
.wind-speeds .mv{font-size:20px;font-weight:bold;color:#d0d0e4}
.wind-speeds .ml{font-size:9px;color:#a8a8c0;text-transform:uppercase;letter-spacing:1px;margin-top:2px}

/* ── STATUS / EMPTY ──────────────────────────────────── */
.no-data{
  color:#9090a8;text-align:center;padding:24px 12px;font-size:11px;
  letter-spacing:1px;line-height:1.8;
}
.err-box{color:#ff6060;text-align:center;padding:24px;line-height:1.8}
.dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  margin-right:5px;vertical-align:middle;
}
.dok{background:#00c8a0}
.dwarn{background:#ffaa00;animation:blink 1.2s step-start infinite}
.derr{background:#ff6060;animation:blink .6s step-start infinite}
@keyframes blink{50%{opacity:0}}

/* ── MISC ─────────────────────────────────────────────── */
hr.div{border:none;border-top:1px solid #181828;margin:8px 0}
.label-row{display:flex;justify-content:space-between;font-size:10px;color:#9090a8;margin-top:3px}

/* ── EDIT MODE ────────────────────────────────────────── */
.card{position:relative}

/* Hidden cards disappear in normal mode */
.card.card-hidden{display:none}
/* In edit mode every card is visible */
body.edit-mode .card.card-hidden{display:block}

/* Clickable overlay */
.edit-ov{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  cursor:pointer;z-index:20;
  transition:background .15s;
}
.card:not(.card-hidden) .edit-ov{background:rgba(0,0,0,.6)}
.card.card-hidden     .edit-ov{background:rgba(0,0,0,.8)}
.edit-ov:hover{filter:brightness(1.15)}

.edit-ov-name{
  font-size:11px;letter-spacing:2px;
  text-transform:uppercase;color:#a0a0b8;
  text-align:center;padding:0 8px;
}
.edit-ov-badge{
  font-size:11px;font-weight:bold;letter-spacing:3px;
  padding:5px 18px;border:2px solid;border-radius:2px;
  text-transform:uppercase;
}
.card:not(.card-hidden) .edit-ov-badge{color:#00c8a0;border-color:#00c8a0;background:#00c8a018}
.card.card-hidden       .edit-ov-badge{color:#ff6060;border-color:#ff6060;background:#ff606018}

/* Edit button */
#edit-btn{
  background:transparent;
  border:1px solid #2a2a40;
  color:#556;
  font-family:'Courier New',Consolas,monospace;
  font-size:11px;letter-spacing:2px;
  padding:5px 16px;cursor:pointer;border-radius:2px;
  text-transform:uppercase;transition:all .2s;
}
#edit-btn:hover{border-color:#4db8ff;color:#4db8ff}
body.edit-mode #edit-btn{border-color:#00c8a0;color:#00c8a0;background:#00c8a015}

/* ── DRAG & DROP ──────────────────────────────────────── */
body.edit-mode .edit-ov{cursor:grab}
body.edit-mode .edit-ov:active{cursor:grabbing}
.edit-ov-grip{font-size:22px;opacity:.45;color:#4db8ff;margin-bottom:6px;line-height:1}

/* ── RESIZE HANDLE ────────────────────────────────────── */
.resize-handle{
  position:absolute;top:0;bottom:0;right:0;
  width:14px;cursor:col-resize;z-index:25;
  display:none;align-items:center;justify-content:center;
}
body.edit-mode .resize-handle{display:flex}
.resize-handle::after{
  content:'';width:3px;height:36px;
  background:#4db8ff;border-radius:2px;
  opacity:.35;transition:opacity .15s;
}
.resize-handle:hover::after{opacity:.9}
body.edit-mode.resizing *{user-select:none;cursor:col-resize!important}

.edit-ov-span{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;padding:3px 10px;margin-top:2px;
  border:1px solid #2a2a40;border-radius:2px;
  transition:border-color .15s,background .15s;
}
.edit-ov-span:hover{border-color:#4db8ff;background:#4db8ff10}
.edit-ov-span-blocks{font-size:14px;letter-spacing:3px;color:#4db8ff;line-height:1.2}
.edit-ov-span-label{font-size:8px;color:#6a6a88;letter-spacing:1.5px;text-transform:uppercase}
[data-wid].drag-source{opacity:.3;border-style:dashed;border-color:#2a2a50}
[data-wid].drag-over{outline:2px solid #4db8ff;outline-offset:-2px;border-color:#4db8ff}

/* ── THEME TOGGLE ─────────────────────────────────────── */
#theme-btn{
  background:transparent;
  border:1px solid #2a2a40;
  color:#556;
  font-family:'Courier New',Consolas,monospace;
  font-size:14px;
  width:36px;height:36px;
  cursor:pointer;border-radius:2px;
  transition:all .2s;flex-shrink:0;
}
#theme-btn:hover{border-color:#4db8ff;color:#4db8ff}

/* ── LIGHT MODE ───────────────────────────────────────── */
html[data-theme="light"],
html[data-theme="light"] body{background:#f0f2f8;color:#111}
[data-theme="light"] #hdr{background:#e0e4f0;border-bottom-color:#c8ccdc}
[data-theme="light"] #hdr-title{color:#111}
[data-theme="light"] #hdr-meta{color:#556}
[data-theme="light"] #clock{color:#0055bb;text-shadow:none}
[data-theme="light"] #edit-btn{border-color:#b0b4c8;color:#556}
[data-theme="light"] #edit-btn:hover{border-color:#0055bb;color:#0055bb}
[data-theme="light"] body.edit-mode #edit-btn{border-color:#007a60;color:#007a60;background:#007a6015}
[data-theme="light"] #theme-btn{border-color:#b0b4c8;color:#556}
[data-theme="light"] #theme-btn:hover{border-color:#0055bb;color:#0055bb}
[data-theme="light"] .card{background:#f8f8ff;border-color:#d8dce8}
[data-theme="light"] .ht{background:#d0f5ec;color:#007a60;border-bottom-color:#9addd0}
[data-theme="light"] .hb{background:#d4ebff;color:#005599;border-bottom-color:#99ccff}
[data-theme="light"] .ha{background:#fff2cc;color:#885500;border-bottom-color:#ffdd88}
[data-theme="light"] .hr{background:#ffd4d4;color:#880000;border-bottom-color:#ffaaaa}
[data-theme="light"] .hp{background:#f0d8ff;color:#660099;border-bottom-color:#cc88ff}
[data-theme="light"] .hg{background:#d4f5d4;color:#006600;border-bottom-color:#88dd88}
[data-theme="light"] .hw{background:#e8e8f8;color:#334466;border-bottom-color:#c8c8e8}
[data-theme="light"] .cs{color:#556}
[data-theme="light"] .big{color:#111}
[data-theme="light"] .unit{color:#556}
[data-theme="light"] .slabel{color:#556}
[data-theme="light"] .mrow{border-top-color:#d0d4e8}
[data-theme="light"] .mrow .mv{color:#222}
[data-theme="light"] .mrow .ml{color:#778}
[data-theme="light"] .gauge-wrap svg text{fill:#111}
[data-theme="light"] .gauge-note{color:#778}
[data-theme="light"] .hbar-track{background:#e0e4f0;border-color:#c8ccdc}
[data-theme="light"] .hbar-labels{color:#778}
[data-theme="light"] .aqi-big .alabel{color:#556}
[data-theme="light"] .aqi-big .asub{color:#778}
[data-theme="light"] .pm-table tr:not(:last-child) td{border-bottom-color:#d8dce8}
[data-theme="light"] .pm-bar-bg{background:#e0e4f0}
[data-theme="light"] .wind-dir-label{color:#0055bb}
[data-theme="light"] .wind-speeds .mv{color:#222}
[data-theme="light"] .wind-speeds .ml{color:#778}
[data-theme="light"] .no-data{color:#778}
[data-theme="light"] .err-box{color:#cc0000}
[data-theme="light"] hr.div{border-top-color:#d0d4e8}
[data-theme="light"] .label-row{color:#778}
[data-theme="light"] .dot{filter:brightness(0.8)}
[data-theme="light"] [data-wid].drag-source{border-color:#a0a8c8}
[data-theme="light"] [data-wid].drag-over{outline-color:#0055bb;border-color:#0055bb}
[data-theme="light"] .edit-ov-span{border-color:#c8ccdc}
[data-theme="light"] .edit-ov-span:hover{border-color:#0055bb;background:#0055bb10}
[data-theme="light"] .edit-ov-span-blocks{color:#0055bb}
[data-theme="light"] .edit-ov-span-label{color:#778}
[data-theme="light"] .resize-handle::after{background:#0055bb}

/* ── 5-DAY FORECAST ──────────────────────────────────── */
.fc-grid{display:flex;justify-content:space-around;padding:8px 12px 14px;gap:8px}
.fc-day{flex:1;text-align:center;padding:10px 6px;border-radius:2px;border:1px solid #1c1c2e;background:#0c0c18;min-width:0}
.fc-day-name{font-size:9px;letter-spacing:2px;color:#a8a8c0;text-transform:uppercase;margin-bottom:6px}
.fc-icon{font-size:26px;margin:4px 0;line-height:1.3;display:block}
.fc-hi{font-size:18px;font-weight:bold;color:#ffaa00}
.fc-lo{font-size:13px;color:#4db8ff;margin-left:5px}
.fc-prcp{font-size:9px;color:#4db8ff;margin-top:5px;letter-spacing:.5px}
.fc-cond{font-size:9px;color:#9090a8;margin-top:3px;letter-spacing:.5px}
@media(max-width:480px){.fc-cond{display:none}}
[data-theme="light"] .fc-day{background:#f0f4ff;border-color:#d0d4e8}
[data-theme="light"] .fc-day-name{color:#556}
[data-theme="light"] .fc-hi{color:#bb6600}
[data-theme="light"] .fc-lo{color:#0055bb}
[data-theme="light"] .fc-prcp{color:#0055bb}
[data-theme="light"] .fc-cond{color:#778}

/* ── FORECAST LOCATION EDITOR (edit mode only) ────────── */
.fc-edit-loc{
  width:100%;padding:8px 16px 4px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.fc-edit-loc input{
  width:100%;background:#0a0a14;border:1px solid #2a2a40;
  color:#c8c8d8;font-family:'Courier New',Consolas,monospace;
  font-size:11px;letter-spacing:1px;padding:6px 10px;
  border-radius:2px;outline:none;text-align:center;
}
.fc-edit-loc input:focus{border-color:#4db8ff}
.fc-edit-loc input::placeholder{color:#444460}
.fc-edit-loc-row{display:flex;gap:6px;width:100%}
.fc-edit-loc-row button{
  flex:1;background:transparent;border:1px solid #2a2a40;color:#4db8ff;
  font-family:'Courier New',Consolas,monospace;font-size:10px;
  letter-spacing:2px;padding:5px 6px;border-radius:2px;cursor:pointer;
  text-transform:uppercase;transition:border-color .15s,background .15s;
}
.fc-edit-loc-row button:hover{border-color:#4db8ff;background:#4db8ff14}
.fc-edit-loc-row button.fc-clr-btn{color:#ff6060}
.fc-edit-loc-row button.fc-clr-btn:hover{border-color:#ff6060;background:#ff606014}
.fc-loc-status{font-size:9px;color:#6a6a88;letter-spacing:.5px;text-align:center}
</style>
<script>try{if(localStorage.getItem('wl-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
</head>
<body>

<!-- HEADER -->
<div id="hdr">
  <div id="hdr-left">
    <div id="hdr-title">&#9729; <span id="station-name">WEATHER STATION</span> &mdash; ENVIRONMENTAL MONITOR</div>
    <div id="hdr-meta">
      Report: <span id="rpt-date">--</span> &nbsp;|&nbsp; Updated: <span id="rpt-updated">--</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;flex-shrink:0">
    <div id="sample-badge" style="display:none">SAMPLE DATA</div>
    <button id="edit-btn" onclick="toggleEditMode()">EDIT</button>
    <button id="theme-btn" aria-label="Toggle theme">&#9728;</button>
    <div id="clock">--:--:-- --</div>
  </div>
</div>

<!-- DASHBOARD GRID -->
<div class="grid" id="dash">
  <div class="card span4">
    <div class="no-data">&#9711; CONNECTING TO WEATHER STATION...</div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   THEME TOGGLE
═══════════════════════════════════════════════════════════ */
(function() {
  let t = 'dark';
  try { t = localStorage.getItem('wl-theme') || 'dark'; } catch(e) {}
  const btn = document.getElementById('theme-btn');
  btn.textContent = t === 'light' ? '☾' : '☀';
  btn.addEventListener('click', function() {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    if (next === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('wl-theme', next); } catch(e) {}
    btn.textContent = next === 'light' ? '☾' : '☀';
    refreshChartTheme(next === 'light');
  });
})();

/* ═══════════════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════════════ */
const REFRESH_MS = 5 * 60 * 1000;

function aqiColor(v) {
  if (v == null) return '#a8a8c0';
  if (v <=  50) return '#00e400';
  if (v <= 100) return '#e0e000';
  if (v <= 150) return '#ff7e00';
  if (v <= 200) return '#ff3030';
  if (v <= 300) return '#9f3fa7';
  return '#7e0023';
}
function aqiDesc(v) {
  if (v == null) return 'N/A';
  if (v <=  50) return 'Good';
  if (v <= 100) return 'Moderate';
  if (v <= 150) return 'Unhealthy (Sensitive)';
  if (v <= 200) return 'Unhealthy';
  if (v <= 300) return 'Very Unhealthy';
  return 'Hazardous';
}
function aqiHeaderClass(v) {
  if (v == null || v <= 50) return 'ht';
  if (v <= 100) return 'ha';
  if (v <= 150) return 'ha';
  if (v <= 200) return 'hr';
  return 'hp';
}

function fmt(v, dec=1) {
  return v != null ? (dec === 0 ? Math.round(v) : Number(v).toFixed(dec)) : '—';
}
function fmtDir(deg) {
  if (deg == null) return '—';
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE',
                'S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

/* ═══════════════════════════════════════════════════════════
   CLOCK
═══════════════════════════════════════════════════════════ */
function tickClock() {
  const n = new Date();
  const h = String(n.getHours() % 12 || 12).padStart(2,'0');
  const m = String(n.getMinutes()).padStart(2,'0');
  const s = String(n.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${h}:${m}:${s} ${n.getHours() >= 12 ? 'PM' : 'AM'}`;
}
setInterval(tickClock, 1000);
tickClock();

/* ═══════════════════════════════════════════════════════════
   GAUGE SVG
═══════════════════════════════════════════════════════════ */
function makeSVGGauge(val, max, color, size=180) {
  const cx = size/2, cy = size * 0.54, r = size * 0.36, sw = 13;
  function pt(deg) {
    const rad = (deg - 90) * Math.PI / 180;
    return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
  }
  const S=225, SWEEP=270;
  const pct = Math.min(Math.max((val||0)/max, 0), 1);
  const fill = pct * SWEEP;
  const [sx,sy] = pt(S);
  const [bgx,bgy] = pt(S+SWEEP);
  const [fx,fy] = pt(S+fill);
  const bgLarge=1, fillLarge = fill>180?1:0;

  const vH = size * 0.78;
  return `<svg width="${size}" height="${vH}" viewBox="0 0 ${size} ${size}" style="overflow:visible">
    <path d="M${sx.toFixed(2)} ${sy.toFixed(2)} A${r} ${r} 0 ${bgLarge} 1 ${bgx.toFixed(2)} ${bgy.toFixed(2)}"
      stroke="#1a1a2c" stroke-width="${sw}" fill="none" stroke-linecap="round"/>
    ${fill>0.5?`<path d="M${sx.toFixed(2)} ${sy.toFixed(2)} A${r} ${r} 0 ${fillLarge} 1 ${fx.toFixed(2)} ${fy.toFixed(2)}"
      stroke="${color}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`:``}
    <text x="${cx}" y="${cy+10}" text-anchor="middle"
      font-family="Courier New,monospace" font-size="34" font-weight="bold" fill="#e8e8f4">
      ${val!=null?Math.round(val):'—'}
    </text>
    <text x="${(sx-6).toFixed(1)}" y="${(sy+16).toFixed(1)}" text-anchor="middle"
      font-family="Courier New,monospace" font-size="9" fill="#9090a8">0</text>
    <text x="${(bgx+6).toFixed(1)}" y="${(bgy+16).toFixed(1)}" text-anchor="middle"
      font-family="Courier New,monospace" font-size="9" fill="#9090a8">${max}</text>
  </svg>`;
}

/* ═══════════════════════════════════════════════════════════
   CHART DEFAULTS
═══════════════════════════════════════════════════════════ */
const FONT = "'Courier New', monospace";
const gridColor = '#161624';
const tickColor = '#9090a8';
Chart.defaults.color = tickColor;
Chart.defaults.font.family = FONT;

function baseOpts(extra={}) {
  return {
    responsive:true, maintainAspectRatio:false,
    animation:{duration:400},
    plugins:{
      legend:{display:false},
      tooltip:{
        backgroundColor:'#1a1a2c', titleColor:'#778', bodyColor:'#c8c8d8',
        borderColor:'#2a2a40', borderWidth:1,
        titleFont:{family:FONT,size:10}, bodyFont:{family:FONT,size:11},
      },
      ...extra.plugins
    },
    scales:{
      x:{grid:{color:gridColor}, ticks:{color:tickColor,font:{family:FONT,size:9},maxTicksLimit:10}, ...extra.xExtra},
      y:{grid:{color:gridColor}, ticks:{color:tickColor,font:{family:FONT,size:9}}, beginAtZero:true, ...extra.yExtra}
    }
  };
}

let charts = {};

function refreshChartTheme(isLight) {
  const newGrid = isLight ? '#dde0ec' : '#161624';
  const newTick = isLight ? '#556' : '#6a6a88';
  Chart.defaults.color = newTick;
  Object.values(charts).forEach(c => {
    ['x','y'].forEach(ax => {
      const scale = c.options.scales && c.options.scales[ax];
      if (!scale) return;
      if (scale.grid) scale.grid.color = newGrid;
      if (scale.ticks) scale.ticks.color = newTick;
    });
    const tt = c.options.plugins && c.options.plugins.tooltip;
    if (tt) {
      tt.backgroundColor = isLight ? '#ffffff' : '#1a1a2c';
      tt.titleColor      = isLight ? '#556'    : '#778';
      tt.bodyColor       = isLight ? '#333'    : '#c8c8d8';
      tt.borderColor     = isLight ? '#c8ccdc' : '#2a2a40';
    }
    c.update();
  });
}

function mkChart(id, type, data, opts) {
  if (charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts[id] = new Chart(ctx.getContext('2d'), {type, data, options:opts});
}

/* ═══════════════════════════════════════════════════════════
   5-DAY FORECAST (Open-Meteo — no API key required)
═══════════════════════════════════════════════════════════ */
const WMO_ICON = {
  0:'☀',1:'🌤',2:'⛅',3:'☁',
  45:'🌫',48:'🌫',
  51:'🌦',53:'🌦',55:'🌧',56:'🌨',57:'🌨',
  61:'🌧',63:'🌧',65:'🌧',66:'🌨',67:'🌨',
  71:'🌨',73:'🌨',75:'🌨',77:'🌨',
  80:'🌦',81:'🌦',82:'🌧',
  85:'🌨',86:'🌨',
  95:'⛈',96:'⛈',99:'⛈',
};
const WMO_DESC = {
  0:'CLEAR',1:'MOSTLY CLR',2:'PT CLOUDY',3:'OVERCAST',
  45:'FOG',48:'FOG',
  51:'LT DRIZZLE',53:'DRIZZLE',55:'HVY DRZL',56:'FRZG DRZL',57:'FRZG DRZL',
  61:'LT RAIN',63:'RAIN',65:'HVY RAIN',66:'FRZG RAIN',67:'FRZG RAIN',
  71:'LT SNOW',73:'SNOW',75:'HVY SNOW',77:'SNOW',
  80:'SHOWERS',81:'SHOWERS',82:'HVY SHWRS',
  85:'SNOW SHWRS',86:'HVY SNOW',
  95:'T-STORM',96:'T-STORM',99:'T-STORM',
};

let _fcCache = null;
let _cfgLat  = null;
let _cfgLon  = null;

function _loadSavedLocation() {
  try { const s = localStorage.getItem('wl-forecast-location'); return s ? JSON.parse(s) : null; }
  catch(e) { return null; }
}
function _saveForecastLocation(lat, lon, label) {
  localStorage.setItem('wl-forecast-location', JSON.stringify({lat, lon, label}));
}
function _clearForecastLocation() {
  localStorage.removeItem('wl-forecast-location');
}

async function _geocode(query) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1&addressdetails=1`;
  const res = await fetch(url, {headers:{'Accept-Language':'en'}});
  if (!res.ok) throw new Error('Geocoding service error');
  const results = await res.json();
  if (!results.length) throw new Error(`"${query}" not found`);
  const r = results[0];
  const label = r.display_name.split(',').slice(0, 2).join(',').trim();
  return {lat: parseFloat(r.lat), lon: parseFloat(r.lon), label};
}

async function setForecastLocation() {
  const input  = document.getElementById('fc-loc-input');
  const status = document.getElementById('fc-loc-status');
  if (!input) return;
  const query = input.value.trim();
  if (!query) return;
  if (status) status.textContent = 'Searching…';
  try {
    const loc = await _geocode(query);
    _saveForecastLocation(loc.lat, loc.lon, loc.label);
    _fcCache = null;
    if (status) status.textContent = `✓ ${loc.label}`;
    input.value = '';
    fetchForecast(loc.lat, loc.lon);
  } catch(err) {
    if (status) status.textContent = err.message;
  }
}

function clearForecastLocation() {
  _clearForecastLocation();
  _fcCache = null;
  const status = document.getElementById('fc-loc-status');
  const src = _cfgLat != null && _cfgLon != null && (_cfgLat !== 0 || _cfgLon !== 0)
    ? 'Using config.json location' : 'Using browser location';
  if (status) status.textContent = src;
  fetchForecast(_cfgLat, _cfgLon);
}

async function _getCoords() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation)
      return reject(new Error('Geolocation not supported'));
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat: p.coords.latitude, lon: p.coords.longitude}),
      e => reject(new Error('Location unavailable')),
      {timeout: 10000}
    );
  });
}

function _updateFcSubtitle(label) {
  const sub = document.getElementById('fc-subtitle');
  if (sub) sub.textContent = `Outdoor Forecast · Open-Meteo · ${label}`;
}

async function fetchForecast(cfgLat, cfgLon) {
  const el = document.querySelector('[data-wid="w-forecast"] .cb');
  if (!el) return;

  if (_mockMode) { _updateFcSubtitle('Sample Data'); renderForecast(MOCK_FORECAST); return; }

  if (_fcCache && Date.now() - _fcCache.ts < 30 * 60 * 1000) {
    _updateFcSubtitle(_fcCache.label);
    renderForecast(_fcCache.data);
    return;
  }

  try {
    let lat, lon, locLabel;
    const saved = _loadSavedLocation();
    if (saved) {
      lat = saved.lat;
      lon = saved.lon;
      locLabel = saved.label;
    } else if (cfgLat != null && cfgLon != null && (cfgLat !== 0 || cfgLon !== 0)) {
      lat = cfgLat;
      lon = cfgLon;
      locLabel = 'Config Location';
    } else {
      const coords = await _getCoords();
      lat = coords.lat;
      lon = coords.lon;
      locLabel = 'Current Location';
    }
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}`
      + `&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
      + `&temperature_unit=fahrenheit&timezone=auto&forecast_days=5`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Forecast fetch failed');
    const data = await res.json();
    _fcCache = {data, ts: Date.now(), label: locLabel};
    _updateFcSubtitle(locLabel);
    renderForecast(data);
  } catch(err) {
    if (el) el.innerHTML = `<div class="no-data">${err.message}</div>`;
  }
}

function renderForecast(data) {
  const el = document.querySelector('[data-wid="w-forecast"] .cb');
  if (!el) return;
  const days = data.daily;
  const items = days.time.map((dt, i) => {
    const d = new Date(dt + 'T12:00:00');
    const name = i === 0 ? 'TODAY'
      : d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
    const wmo  = days.weathercode[i];
    const hi   = Math.round(days.temperature_2m_max[i]);
    const lo   = Math.round(days.temperature_2m_min[i]);
    const prcp = days.precipitation_probability_max[i];
    return `
      <div class="fc-day">
        <div class="fc-day-name">${name}</div>
        <span class="fc-icon">${WMO_ICON[wmo] || '?'}</span>
        <div><span class="fc-hi">${hi}°</span><span class="fc-lo">${lo}°</span></div>
        <div class="fc-prcp">&#128167; ${prcp != null ? prcp+'%' : '—'}</div>
        <div class="fc-cond">${WMO_DESC[wmo] || ''}</div>
      </div>`;
  }).join('');
  el.innerHTML = `<div class="fc-grid">${items}</div>`;
}

/* ═══════════════════════════════════════════════════════════
   MOCK / SAMPLE DATA  (used until real API responds)

let _hasRealData = false;
let _mockMode    = true;

function _showSampleBadge(text, warn) {

  b.className = warn ? 'no-conn' : '';

/* ═══════════════════════════════════════════════════════════
   FETCH & REFRESH
═══════════════════════════════════════════════════════════ */
async function refresh() {
  try {
    const [curRes, histRes] = await Promise.all([
      fetch('/api/current'),
      fetch('/api/history'),
    ]);
    if (!curRes.ok) throw new Error(`API ${curRes.status}`);

    const cur  = await curRes.json();
    const hist = histRes.ok ? await histRes.json() : [];

    if (cur.error) throw new Error(cur.error);

    document.getElementById('station-name').textContent =
      cur._station_name || 'WEATHER STATION';

    const now = new Date();
    document.getElementById('rpt-date').textContent =
      now.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'2-digit'}).replace(',',' ').toUpperCase();
    document.getElementById('rpt-updated').textContent =
      now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});

    _hasRealData = true;
    _mockMode    = false;
    _hideSampleBadge();
    build(cur, hist);

  } catch(err) {
    console.error(err);
    if (_hasRealData) {
      const dash = document.getElementById('dash');
      dash.innerHTML = `
        <div class="card span4">
          <div class="ch hr">CONNECTION ERROR</div>
          <div class="cb err-box">
            <span id="err-msg"></span><br><br>
            Check API credentials in config.json and ensure the station ID is set.
          </div>
        </div>`;
      document.getElementById('err-msg').textContent = err.message;
    } else {
      _showSampleBadge('NO CONNECTION', true);
    }
  }
}

setInterval(refresh, REFRESH_MS);

/* ═══════════════════════════════════════════════════════════
   WIDGET EDIT MODE
═══════════════════════════════════════════════════════════ */
const WIDGET_NAMES = {
  'w-temp':      'Temperature',
  'w-humidity':  'Humidity',
  'w-aqi':       'AQI Gauge',
  'w-pm':        'Particulate Matter',
  'w-aqi-today': 'AQI Today',
  'w-aqi-7d':    '7-Day AQI',
  'w-tmp-today': 'Temp Today',
  'w-tmphum':    'Temp / Humidity 7D',
  'w-heat':      'Heat Index',
  'w-wetbulb':   'Wet Bulb',
  'w-wind':      'Wind',
  'w-solar':     'Solar & UV',
  'w-pressure':  'Pressure',
  'w-rainfall':  'Rainfall',
  'w-aqi-detail':'AQI Detail',
  'w-status':    'Data Status',
  'w-forecast':  '5-Day Forecast',
};

let editMode = false;
let _dragSrc  = null;

function loadStates() {
  try {
    const s = localStorage.getItem('wl-widget-states');
    if (s) return JSON.parse(s);
  } catch(e) {}
  return Object.fromEntries(Object.keys(WIDGET_NAMES).map(k => [k, true]));
}
function saveStates(s) {
  localStorage.setItem('wl-widget-states', JSON.stringify(s));
}
let wStates = loadStates();

function loadSpans() {
  try { const s = localStorage.getItem('wl-widget-spans'); return s ? JSON.parse(s) : {}; }
  catch(e) { return {}; }
}
function saveSpans(s) { localStorage.setItem('wl-widget-spans', JSON.stringify(s)); }
let wSpans = loadSpans();

const DEFAULT_SPANS = {'w-forecast': 4};

function _resolveSpan(wid) {
  return wSpans[wid] != null ? wSpans[wid] : (DEFAULT_SPANS[wid] || 1);
}

function applyWidgetSpans() {
  for (const wid of Object.keys(WIDGET_NAMES)) {
    const card = document.querySelector(`[data-wid="${wid}"]`);
    if (!card) continue;
    card.classList.remove('span2','span3','span4');
    const span = _resolveSpan(wid);
    if (span > 1) card.classList.add(`span${span}`);
  }
}

function cycleWidgetSpan(wid) {
  const cur = _resolveSpan(wid);
  wSpans[wid] = cur >= 4 ? 1 : cur + 1;
  saveSpans(wSpans);
  applyWidgetSpans();
  _renderOverlays();
}

function applyWidgetStates() {
  applyWidgetOrder();
  applyWidgetSpans();
  for (const [wid, enabled] of Object.entries(wStates)) {
    const card = document.querySelector(`[data-wid="${wid}"]`);
    if (!card) continue;
    card.classList.toggle('card-hidden', !enabled);
  }
  // Hide rows where every widget is disabled (skip in edit mode so they stay reachable)
  document.querySelectorAll('.dash-row').forEach(row => {
    const cards = row.querySelectorAll('[data-wid]');
    const allHidden = Array.from(cards).every(c => c.classList.contains('card-hidden'));
    row.style.display = (!editMode && allHidden) ? 'none' : '';
  });
  if (editMode) _renderOverlays();
}

function startCardResize(e, wid) {
  e.preventDefault();
  e.stopPropagation();
  const card = document.querySelector(`[data-wid="${wid}"]`);
  const row  = card.parentElement;
  const rr   = row.getBoundingClientRect();
  const gap  = 9;
  const cols = getComputedStyle(row).gridTemplateColumns.split(' ').length;
  const colW = (rr.width - gap * (cols - 1)) / cols;
  const startLeft = card.getBoundingClientRect().left - rr.left;
  const startCol  = Math.round(startLeft / (colW + gap));
  const maxSpan   = cols - startCol;
  let curSpan = _resolveSpan(wid);

  document.body.classList.add('resizing');

  const onMove = mv => {
    const mx = mv.clientX - rr.left;
    const col = Math.floor((mx - gap / 2) / (colW + gap));
    const ns  = Math.max(1, Math.min(col - startCol + 1, maxSpan));
    if (ns !== curSpan) {
      curSpan = ns;
      card.classList.remove('span2','span3','span4');
      if (ns > 1) card.classList.add('span' + ns);
    }
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.classList.remove('resizing');
    wSpans[wid] = curSpan;
    saveSpans(wSpans);
    _renderOverlays();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function _renderOverlays() {
  document.querySelectorAll('.edit-ov').forEach(el => el.remove());
  document.querySelectorAll('.resize-handle').forEach(el => el.remove());
  document.querySelectorAll('[data-wid]').forEach(card => {
    const wid     = card.dataset.wid;
    const enabled = wStates[wid] !== false;
    const ov      = document.createElement('div');
    ov.className  = 'edit-ov';
    ov.draggable  = true;
    ov.innerHTML  = `
      <div class="edit-ov-grip">&#8801;</div>
      <div class="edit-ov-name">${WIDGET_NAMES[wid] || wid}</div>
      <div class="edit-ov-badge">${enabled ? '● ENABLED' : '○ DISABLED'}</div>`;

    const _span = _resolveSpan(wid);
    const spanDiv = document.createElement('div');
    spanDiv.className = 'edit-ov-span';
    spanDiv.innerHTML = `<span class="edit-ov-span-blocks">${'■'.repeat(_span)}${'□'.repeat(4-_span)}</span>`
      + `<span class="edit-ov-span-label">${_span} COL</span>`;
    spanDiv.addEventListener('click', e => { e.stopPropagation(); cycleWidgetSpan(wid); });
    spanDiv.addEventListener('dragstart', e => e.stopPropagation());
    ov.appendChild(spanDiv);

    if (wid === 'w-forecast') {
      const saved = _loadSavedLocation();
      const locDiv = document.createElement('div');
      locDiv.className = 'fc-edit-loc';
      locDiv.innerHTML = `
        <input id="fc-loc-input" type="text" placeholder="City name or ZIP code"
          onkeydown="if(event.key==='Enter')setForecastLocation()">
        <div class="fc-edit-loc-row">
          <button onclick="setForecastLocation()">SET LOCATION</button>
          <button class="fc-clr-btn" onclick="clearForecastLocation()">CLEAR</button>
        </div>
        <div id="fc-loc-status" class="fc-loc-status"></div>`;
      const statusEl = locDiv.querySelector('#fc-loc-status');
      if (saved) {
        statusEl.textContent = `✓ ${saved.label}`;
      } else if (_cfgLat != null && _cfgLon != null && (_cfgLat !== 0 || _cfgLon !== 0)) {
        statusEl.textContent = 'Using config.json location';
      } else {
        statusEl.textContent = 'Using browser location';
      }
      locDiv.addEventListener('click',     e => e.stopPropagation());
      locDiv.addEventListener('dragstart', e => e.stopPropagation());
      ov.appendChild(locDiv);
    }

    ov.addEventListener('click', () => toggleWidget(wid));

    ov.addEventListener('dragstart', e => {
      _dragSrc = wid;
      card.classList.add('drag-source');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', wid);
      e.dataTransfer.setDragImage(card, card.offsetWidth / 2, 20);
    });
    ov.addEventListener('dragend', () => {
      _dragSrc = null;
      document.querySelectorAll('[data-wid]').forEach(c =>
        c.classList.remove('drag-source', 'drag-over'));
    });
    ov.addEventListener('dragenter', e => {
      if (!_dragSrc || _dragSrc === wid) return;
      e.preventDefault();
      card.classList.add('drag-over');
    });
    ov.addEventListener('dragover', e => {
      if (!_dragSrc || _dragSrc === wid) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });
    ov.addEventListener('dragleave', e => {
      if (!ov.contains(e.relatedTarget)) card.classList.remove('drag-over');
    });
    ov.addEventListener('drop', e => {
      e.preventDefault();
      card.classList.remove('drag-over');
      if (_dragSrc && _dragSrc !== wid) {
        _swapCards(_dragSrc, wid);
        saveOrder();
      }
    });

    card.appendChild(ov);

    const rh = document.createElement('div');
    rh.className = 'resize-handle';
    rh.title = 'Drag to resize';
    rh.addEventListener('mousedown', e => startCardResize(e, wid));
    rh.addEventListener('click', e => e.stopPropagation());
    card.appendChild(rh);
  });
}

function toggleWidget(wid) {
  wStates[wid] = !wStates[wid];
  saveStates(wStates);
  applyWidgetStates();
}

function loadOrder() {
  try { const s = localStorage.getItem('wl-widget-order'); return s ? JSON.parse(s) : null; }
  catch(e) { return null; }
}
function saveOrder() {
  const order = Array.from(document.querySelectorAll('[data-wid]')).map(c => c.dataset.wid);
  localStorage.setItem('wl-widget-order', JSON.stringify(order));
}
function applyWidgetOrder() {
  const saved = loadOrder();
  if (!saved || !saved.length) return;
  const rows     = Array.from(document.querySelectorAll('.dash-row'));
  const allCards = Array.from(document.querySelectorAll('[data-wid]'));
  const cardMap  = {};
  allCards.forEach(c => cardMap[c.dataset.wid] = c);
  const desired = [
    ...saved.filter(w => cardMap[w]),
    ...allCards.filter(c => !saved.includes(c.dataset.wid)).map(c => c.dataset.wid),
  ];
  const counts = rows.map(r => r.querySelectorAll('[data-wid]').length);
  allCards.forEach(c => c.parentNode.removeChild(c));
  let i = 0;
  rows.forEach((row, ri) => {
    for (let j = 0; j < counts[ri] && i < desired.length; j++) {
      const c = cardMap[desired[i++]];
      if (c) row.appendChild(c);
    }
  });
}
function _swapCards(widA, widB) {
  const a = document.querySelector(`[data-wid="${widA}"]`);
  const b = document.querySelector(`[data-wid="${widB}"]`);
  if (!a || !b) return;
  const tmp = document.createElement('span');
  a.parentNode.insertBefore(tmp, a);
  b.parentNode.insertBefore(a, b);
  tmp.parentNode.insertBefore(b, tmp);
  tmp.parentNode.removeChild(tmp);
}

function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  document.getElementById('edit-btn').textContent = editMode ? 'DONE' : 'EDIT';
  if (editMode) {
    _renderOverlays();
  } else {
    document.querySelectorAll('.edit-ov').forEach(el => el.remove());
    document.querySelectorAll('.resize-handle').forEach(el => el.remove());
  }
}
